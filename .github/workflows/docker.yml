name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/bhxuk/documentation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: documentation:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name doc -p 3000:3000 documentation:test
          for i in $(seq 1 30); do curl -fs http://localhost:3000/api/health && break; sleep 1; done
          curl -fs http://localhost:3000/api/health
          curl -fs http://localhost:3000/ | grep -q '<div id="root">'
          curl -fs http://localhost:3000/api/tree | grep -q Welcome.md
          curl -fs -X PUT -H 'Content-Type: application/json' -d '{"content":"hello"}' 'http://localhost:3000/api/file?path=test/a.txt'
          curl -fs 'http://localhost:3000/api/search?q=hello' | grep -q 'test/a.txt'
          docker logs doc

      - name: Container logs
        if: failure()
        run: docker ps -a; docker logs doc || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          cache-from: type=gha
